<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelLabel || 'Cancelar' }}</button>
  <button mat-flat-button [class.destructive]="data.isDestructive" (click)="confirm()">
    {{ data.confirmLabel || data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
