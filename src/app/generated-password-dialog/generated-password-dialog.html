<h2 mat-dialog-title>Cliente creado: contraseña generada</h2>
<mat-dialog-content>
  <p>
    Esta es la única vez que vas a ver esta contraseña. Guardala y compartila con el cliente para
    que pueda entrar a la tienda.
  </p>
  <p class="password">{{ data.password }}</p>
  <p role="status" aria-live="polite">{{ copyMessage() }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="copyPassword()">Copiar contraseña</button>
  <button mat-flat-button [mat-dialog-close]="true">Listo</button>
</mat-dialog-actions>
