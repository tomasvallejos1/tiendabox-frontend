<mat-card class="not-found" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Página no encontrada</mat-card-title>
    <mat-card-subtitle>Error 404</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>La página que buscás no existe o fue movida.</p>
  </mat-card-content>
  <mat-card-actions>
    <a matButton="filled" routerLink="/productos">Ir al catálogo</a>
  </mat-card-actions>
</mat-card>
