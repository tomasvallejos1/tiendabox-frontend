<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="outlined" (click)="cancel()">
    {{ data.cancelLabel || 'Cancelar' }}
  </button>
  <button matButton="filled" color="warn" (click)="confirm()">
    {{ data.confirmLabel || 'Confirmar' }}
  </button>
</mat-dialog-actions>
